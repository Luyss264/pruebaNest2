services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fleetcore}
    volumes:
      - fleetcore-postgres-data:/var/lib/postgresql/data
    networks:
      - fleetcore-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-fleetcore}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetcore-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleetcore-internal

volumes:
  fleetcore-postgres-data:

networks:
  fleetcore-internal:
    driver: bridge
